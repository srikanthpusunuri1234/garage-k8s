apiVersion: v1
kind: Secret
metadata:
  name: media-db-creds
  namespace: garage-s3
type: Opaque
stringData:
  POSTGRES_USER: "vault_app"
  POSTGRES_PASSWORD: "VaultStrongPassword2026!"
  POSTGRES_DB: "mediavault"
  PGDATA: "/var/lib/postgresql/data/pgdata"
---
apiVersion: v1
kind: Service
metadata:
  name: media-db
  namespace: garage-s3
  labels:
    app: media-db
spec:
  type: ClusterIP
  selector:
    app: media-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-db-netpol
  namespace: garage-s3
spec:
  podSelector:
    matchLabels:
      app: media-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: media-vault
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: media-db
  namespace: garage-s3
spec:
  serviceName: media-db
  replicas: 1
  selector:
    matchLabels:
      app: media-db
  template:
    metadata:
      labels:
        app: media-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: media-db-creds
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
