apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-vault
  namespace: garage-s3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-vault
  template:
    metadata:
      labels:
        app: media-vault
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-vault
          image: media-vault:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "media-db.garage-s3.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: media-s3-creds
            - secretRef:
                name: media-db-creds
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: media-vault
  namespace: garage-s3
spec:
  type: NodePort
  selector:
    app: media-vault
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
